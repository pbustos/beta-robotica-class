[Proxies]
# Proxies for required interfaces
# webots-bridge: 20006 with etc/chocachoca_config.toml, 10006 with its default etc/config.toml
Webots2Robocomp = "webots2robocomp:tcp -h localhost -p 20006"


[Grader]
RobotDEF = "shadow"            # DEF of the robot in the Webots world
PersonDEF = "HUMAN_Manual"     # DEF of the person (beta_human.wbt)
Duration = 180.0               # s, length of one measurement
DistanceRef = 1000.0           # mm, nominal robot-person distance (centre to centre)
ResultsFile = "reference_runs.csv"    # one line appended per measurement
Student = "no obstacles: PID only, deadband 30, integral decay below 0.9 m"                   # optional: pre-fills the student/group field
AutoStart = true              # true: start measuring as soon as the component is up (unattended runs)

[Period]
Compute = 100
Emergency = 500

[Component.Debug]
Verbose = true

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
