[[components]]
name = "helios"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/laser/lidar3D"
cmd = "bin/Lidar3D etc/config_helios_webots"
ice_name = "Lidar3D:tcp -h localhost -p 10098"

[[components]]
name = "pearl"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/laser/lidar3D"
cmd = "bin/Lidar3D etc/config_pearl_webots"
ice_name = "Lidar3D:tcp -h localhost -p 11990"

# Reads BOTH raw lidars (helios 11990, bpearl 11989), deletes the returns that fall inside the
# robot's own mesh (robots/Shadow/shadow.stl) plus everything outside Floor.z..Top.z, and serves the
# merged, body-free cloud on 11995. Without it every consumer sees thousands of returns on the robot
# itself: lidar3D stopped filtering when its filters moved here (lidar3D commit f0b60f43), and the
# "filter out body points" comment left behind in lidar3D/src/specificworker.cpp:299 filters nothing.
# Start it AFTER the two lidars it reads.

[[components]]
name = "lidar_filter"
cwd = "~/robocomp/components/robocomp-robolab/components/hardware/laser/lidar3DFilter"
cmd = "bin/lidar3DFilter etc/config_shadow_webots"
ice_name = "Lidar3D:tcp -h localhost -p 11995"

